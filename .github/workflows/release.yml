name: Build, Test & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create release for (e.g. v1.10.0). Leave empty for build+test only.'
        required: false
        type: string

permissions:
  contents: write

env:
  MINGW_PATH: C:\mingw64\bin

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MinGW to PATH
        shell: cmd
        run: echo %MINGW_PATH%>>%GITHUB_PATH%

      - name: Build sshpass
        shell: cmd
        run: make -f Makefile.win

      - name: Verify binary
        shell: cmd
        run: sshpass.exe -V

      - name: Build unit tests
        shell: cmd
        run: |
          gcc -Wall -O2 -D_WIN32_WINNT=0x0A00 -DNTDDI_VERSION=0x0A000006 -DTESTING -I tests -o tests\test_match.exe tests\test_match.c main_win.c -lkernel32
          gcc -Wall -O2 -D_WIN32_WINNT=0x0A00 -DNTDDI_VERSION=0x0A000006 -DTESTING -I tests -o tests\test_build_cmdline.exe tests\test_build_cmdline.c main_win.c -lkernel32
          gcc -Wall -O2 -D_WIN32_WINNT=0x0A00 -DNTDDI_VERSION=0x0A000006 -DTESTING -I tests -o tests\test_handleoutput.exe tests\test_handleoutput.c main_win.c -lkernel32

      - name: Run unit tests
        shell: cmd
        run: |
          tests\test_match.exe
          tests\test_build_cmdline.exe
          tests\test_handleoutput.exe

      - name: Run integration tests
        shell: cmd
        run: tests\test_integration.cmd .

      - name: Upload sshpass binary
        uses: actions/upload-artifact@v4
        with:
          name: sshpass-exe
          path: sshpass.exe
          retention-days: 5

  package-and-release:
    name: Package & Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag: ${{ steps.version.outputs.TAG }}
      zip_url: ${{ steps.release_url.outputs.ZIP_URL }}
      zip_hash: ${{ steps.zip.outputs.ZIP_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sshpass binary
        uses: actions/download-artifact@v4
        with:
          name: sshpass-exe

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Create release zip and compute hash
        id: zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $zipName = "sshpass-win64-$version.zip"

          New-Item -ItemType Directory -Path staging -Force
          Copy-Item sshpass.exe staging/
          Copy-Item README.md staging/
          Copy-Item COPYING staging/
          Copy-Item sshpass.1 staging/

          Compress-Archive -Path staging/* -DestinationPath $zipName

          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          "$hash" | Out-File -FilePath "sha256.txt" -NoNewline

          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
          echo "ZIP_HASH=$hash" >> $env:GITHUB_OUTPUT
          echo "SHA256: $hash"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: sshpass-win64 v${{ steps.version.outputs.VERSION }}
          body: |
            ## sshpass-win64 v${{ steps.version.outputs.VERSION }}

            Native Windows 64-bit port of sshpass using the ConPTY API.

            ### Downloads
            - **`sshpass-win64-${{ steps.version.outputs.VERSION }}.zip`** — Standalone binary (just extract and use)

            ### Install via Scoop
            ```powershell
            scoop bucket add sshpass https://github.com/sharpninja/sshpass-win64
            scoop install sshpass
            ```

            ### Install via Chocolatey
            ```powershell
            choco install sshpass-win64
            ```

            ### Install via winget
            ```powershell
            winget install SharpNinja.sshpass
            ```

            ### Requirements
            - Windows 10 version 1809 or later

            ### SHA256
            `${{ steps.zip.outputs.ZIP_HASH }}`
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.zip.outputs.ZIP_NAME }}
            sha256.txt

      - name: Get release artifact URL
        id: release_url
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tag = "${{ steps.version.outputs.TAG }}"
          $zipUrl = "https://github.com/sharpninja/sshpass-win64/releases/download/$tag/sshpass-win64-$version.zip"
          echo "ZIP_URL=$zipUrl" >> $env:GITHUB_OUTPUT
          echo "Release zip URL: $zipUrl"

      - name: Build Scoop manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $hash = "${{ steps.zip.outputs.ZIP_HASH }}"
          $zipUrl = "${{ steps.release_url.outputs.ZIP_URL }}"

          $manifest = Get-Content packaging/scoop/sshpass.json | ConvertFrom-Json
          $manifest.version = $version
          $manifest.architecture.'64bit'.url = $zipUrl
          $manifest.architecture.'64bit'.hash = $hash
          $manifest | ConvertTo-Json -Depth 10 | Set-Content sshpass-scoop-manifest.json

          Get-Content sshpass-scoop-manifest.json

      - name: Build winget manifests
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $hash = "${{ steps.zip.outputs.ZIP_HASH }}"
          $zipUrl = "${{ steps.release_url.outputs.ZIP_URL }}"

          New-Item -ItemType Directory -Path winget-out -Force

          $content = Get-Content packaging/winget/SharpNinja.sshpass.yaml -Raw
          $content = $content -replace '1\.10\.0', $version
          $content | Set-Content winget-out/SharpNinja.sshpass.yaml

          $content = Get-Content packaging/winget/SharpNinja.sshpass.locale.en-US.yaml -Raw
          $content = $content -replace '1\.10\.0', $version
          $content | Set-Content winget-out/SharpNinja.sshpass.locale.en-US.yaml

          $content = Get-Content packaging/winget/SharpNinja.sshpass.installer.yaml -Raw
          $content = $content -replace '1\.10\.0', $version
          $content = $content -replace 'PLACEHOLDER_HASH', $hash
          $content = $content -replace 'https://github\.com/sharpninja/sshpass-win64/releases/download/v1\.10\.0/sshpass-win64-1\.10\.0\.zip', $zipUrl
          $content | Set-Content winget-out/SharpNinja.sshpass.installer.yaml

          Compress-Archive -Path winget-out/* -DestinationPath "sshpass-winget-manifests-$version.zip"

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $hash = "${{ steps.zip.outputs.ZIP_HASH }}"
          $zipUrl = "${{ steps.release_url.outputs.ZIP_URL }}"

          $nuspecPath = "packaging/chocolatey/sshpass-win64.nuspec"
          (Get-Content $nuspecPath) -replace '\$VERSION\$', $version | Set-Content $nuspecPath

          $installPath = "packaging/chocolatey/tools/chocolateyinstall.ps1"
          $content = Get-Content $installPath -Raw
          $content = $content -replace '\$CHECKSUM\$', $hash
          $content = $content -replace 'https://github\.com/sharpninja/sshpass-win64/releases/download/v\$VERSION\$/sshpass-win64-\$VERSION\$\.zip', $zipUrl
          $content | Set-Content $installPath

          if (Get-Command choco -ErrorAction SilentlyContinue) {
            Push-Location packaging/chocolatey
            choco pack
            Pop-Location
            $nupkg = Get-ChildItem packaging/chocolatey/*.nupkg | Select-Object -First 1
            if ($nupkg) {
              Copy-Item $nupkg.FullName .
              echo "NUPKG_NAME=$($nupkg.Name)" >> $env:GITHUB_ENV
            }
          } else {
            echo "Chocolatey not available, skipping .nupkg creation"
            Compress-Archive -Path packaging/chocolatey/* -DestinationPath "sshpass-win64-$version-chocolatey.zip"
            echo "NUPKG_NAME=sshpass-win64-$version-chocolatey.zip" >> $env:GITHUB_ENV
          }

      - name: Upload package manifests to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          files: |
            sshpass-scoop-manifest.json
            sshpass-winget-manifests-${{ steps.version.outputs.VERSION }}.zip
            ${{ env.NUPKG_NAME }}

      - name: Upload Scoop manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: scoop-manifest
          path: sshpass-scoop-manifest.json
          retention-days: 5

      - name: Upload Chocolatey package artifact
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-package
          path: ${{ env.NUPKG_NAME }}
          retention-days: 5

  # ============================================================
  # Deploy to Scoop (PR to ScoopInstaller/Extras)
  # ============================================================
  deploy-scoop:
    name: Submit to Scoop Extras
    needs: package-and-release
    if: needs.package-and-release.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMIT_PAT }}
          submodules: true
          fetch-depth: 1

      - name: Download Scoop manifest
        uses: actions/download-artifact@v4
        with:
          name: scoop-manifest

      - name: Submit PR to ScoopInstaller/Extras
        env:
          GH_TOKEN: ${{ secrets.SUBMIT_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.package-and-release.outputs.version }}"
          BRANCH="sshpass-v${VERSION}"

          echo "=== Submitting sshpass $VERSION to ScoopInstaller/Extras ==="

          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Work in the submodule (already cloned with SUBMIT_PAT credentials)
          cd packaging/forks/Extras

          # Sync with upstream and update
          git remote add upstream https://github.com/ScoopInstaller/Extras.git 2>/dev/null || true
          git fetch upstream master --depth=1
          git checkout -B master upstream/master
          git push origin master --force 2>/dev/null || true

          # Create branch
          git checkout -b "$BRANCH"

          # Copy manifest
          cp "$GITHUB_WORKSPACE/sshpass-scoop-manifest.json" bucket/sshpass.json

          # Commit and push
          git add bucket/sshpass.json
          git commit -m "sshpass: Add/update to version $VERSION"
          git push -u origin "$BRANCH" --force

          # Create PR (or skip if already exists)
          PR_URL=$(gh pr create \
            --repo ScoopInstaller/Extras \
            --head "sharpninja:$BRANCH" \
            --base master \
            --title "sshpass: Add/update to version $VERSION" \
            --body "## New/Updated App Submission

          **App name:** sshpass
          **Version:** $VERSION
          **Homepage:** https://github.com/sharpninja/sshpass-win64
          **Description:** Non-interactive SSH password authentication tool - native Win64 port using ConPTY

          This is a native Windows 64-bit port of the Linux \`sshpass\` utility, using the Windows ConPTY API instead of Unix PTY.

          ---
          *Automated submission from [sshpass-win64](https://github.com/sharpninja/sshpass-win64) CI/CD pipeline.*" 2>&1) || true

          if echo "$PR_URL" | grep -q "already exists"; then
            echo "PR already exists — skipping. $PR_URL"
          else
            echo "PR created: $PR_URL"
          fi

          echo "=== Scoop submission complete ==="

  # ============================================================
  # Deploy to winget (PR to microsoft/winget-pkgs)
  # ============================================================
  deploy-winget:
    name: Submit to winget
    needs: package-and-release
    if: needs.package-and-release.result == 'success'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Install wingetcreate
        shell: pwsh
        run: |
          $installDir = "$env:RUNNER_TEMP"
          $releases = Invoke-RestMethod "https://api.github.com/repos/microsoft/winget-create/releases/latest"
          $asset = $releases.assets | Where-Object { $_.name -eq "wingetcreate.exe" }
          if ($asset) {
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$installDir\wingetcreate.exe"
            echo "$installDir" >> $env:GITHUB_PATH
            echo "Downloaded wingetcreate.exe to $installDir"
          } else {
            dotnet tool install --global Microsoft.WingetCreate
            echo "Installed via dotnet tool"
          }

      - name: Check for existing winget submission
        id: winget_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SUBMIT_PAT }}
        run: |
          $version = "${{ needs.package-and-release.outputs.version }}"
          $manifestPath = "manifests/s/SharpNinja/sshpass/$version"
          $response = gh api "repos/microsoft/winget-pkgs/contents/$manifestPath" 2>&1
          if ($LASTEXITCODE -eq 0) {
            echo "Version $version already exists in winget-pkgs — skipping."
            echo "SKIP=true" >> $env:GITHUB_OUTPUT
          } else {
            $prs = gh pr list --repo microsoft/winget-pkgs --search "SharpNinja.sshpass $version" --json number --jq '.[].number' 2>&1
            if ($prs -match '^\d+$') {
              echo "Open PR found for version $version — skipping."
              echo "SKIP=true" >> $env:GITHUB_OUTPUT
            } else {
              echo "No existing submission found for version $version."
              echo "SKIP=false" >> $env:GITHUB_OUTPUT
            }
          }

      - name: Checkout with submodules
        if: steps.winget_check.outputs.SKIP != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMIT_PAT }}
          submodules: false
          fetch-depth: 1

      - name: Restore winget-pkgs cache
        if: steps.winget_check.outputs.SKIP != 'true'
        id: cache_winget
        uses: actions/cache@v4
        with:
          path: packaging/forks/winget-pkgs
          key: winget-pkgs-submodule-v1

      - name: Initialize winget-pkgs submodule
        if: steps.winget_check.outputs.SKIP != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SUBMIT_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          if ("${{ steps.cache_winget.outputs.cache-hit }}" -eq "true") {
            echo "Cache hit — pulling latest from fork..."
            Set-Location packaging/forks/winget-pkgs
            git remote set-url origin https://github.com/sharpninja/winget-pkgs.git
            git fetch origin master --depth=1
            git checkout master
            git reset --hard origin/master
          } else {
            echo "Cache miss — cloning winget-pkgs submodule (shallow)..."
            git submodule update --init --depth=1 packaging/forks/winget-pkgs
          }

      - name: Submit to winget-pkgs
        if: steps.winget_check.outputs.SKIP != 'true'
        shell: pwsh
        env:
          SUBMIT_PAT: ${{ secrets.SUBMIT_PAT }}
          GH_TOKEN: ${{ secrets.SUBMIT_PAT }}
        run: |
          $version = "${{ needs.package-and-release.outputs.version }}"
          $zipUrl = "${{ needs.package-and-release.outputs.zip_url }}"
          $hash = "${{ needs.package-and-release.outputs.zip_hash }}"

          echo "=== Submitting sshpass $version to winget-pkgs ==="

          $exe = "wingetcreate"
          if (Test-Path ".\wingetcreate.exe") { $exe = ".\wingetcreate.exe" }

          # Try wingetcreate update first (works for existing packages)
          & $exe update SharpNinja.sshpass `
            --urls $zipUrl --version $version --submit `
            --token $env:SUBMIT_PAT 2>&1

          if ($LASTEXITCODE -eq 0) {
            echo "=== winget submission complete (via wingetcreate) ==="
            exit 0
          }

          echo "wingetcreate update failed — using submodule PR approach..."

          # Work in the submodule
          Set-Location packaging/forks/winget-pkgs

          # Configure git credential store for pushing to fork
          $pat = $env:SUBMIT_PAT
          git config credential.helper store
          $credLine = "https://x-access-token:${pat}@github.com"
          [System.IO.File]::WriteAllText("$env:USERPROFILE\.git-credentials", $credLine)
          git remote set-url origin "https://github.com/sharpninja/winget-pkgs.git"

          # Sync with upstream
          git remote add upstream https://github.com/microsoft/winget-pkgs.git 2>$null
          gh repo sync sharpninja/winget-pkgs --branch master 2>&1 | Out-Null
          git fetch origin master --depth=1
          git checkout -B master origin/master

          $branch = "SharpNinja.sshpass-$version"
          git checkout -b $branch

          # Create manifest directory
          $manifestDir = "manifests/s/SharpNinja/sshpass/$version"
          New-Item -ItemType Directory -Path $manifestDir -Force

          # Build manifests from templates
          $content = Get-Content "$env:GITHUB_WORKSPACE\packaging\winget\SharpNinja.sshpass.yaml" -Raw
          $content = $content -replace '1\.10\.0', $version
          $content | Set-Content "$manifestDir\SharpNinja.sshpass.yaml"

          $content = Get-Content "$env:GITHUB_WORKSPACE\packaging\winget\SharpNinja.sshpass.locale.en-US.yaml" -Raw
          $content = $content -replace '1\.10\.0', $version
          $content | Set-Content "$manifestDir\SharpNinja.sshpass.locale.en-US.yaml"

          $content = Get-Content "$env:GITHUB_WORKSPACE\packaging\winget\SharpNinja.sshpass.installer.yaml" -Raw
          $content = $content -replace '1\.10\.0', $version
          $content = $content -replace 'PLACEHOLDER_HASH', $hash
          $content = $content -replace 'https://github\.com/sharpninja/sshpass-win64/releases/download/v1\.10\.0/sshpass-win64-1\.10\.0\.zip', $zipUrl
          $content | Set-Content "$manifestDir\SharpNinja.sshpass.installer.yaml"

          # Commit and push
          git add manifests/
          git commit -m "New package: SharpNinja.sshpass version $version"
          git push -u origin $branch --force

          # Create PR
          gh pr create `
            --repo microsoft/winget-pkgs `
            --head "sharpninja:$branch" `
            --base master `
            --title "New package: SharpNinja.sshpass version $version" `
            --body "### New Package Submission`n`n- PackageIdentifier: SharpNinja.sshpass`n- PackageVersion: $version`n- URL: $zipUrl`n`nNative Windows 64-bit port of sshpass using the ConPTY API.`n`n---`n*Automated submission from [sshpass-win64](https://github.com/sharpninja/sshpass-win64) CI/CD pipeline.*"

          echo "=== winget submission complete (via submodule PR) ==="

  # ============================================================
  # Deploy to Chocolatey Community Repository
  # ============================================================
  deploy-chocolatey:
    name: Submit to Chocolatey
    needs: package-and-release
    if: needs.package-and-release.result == 'success'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sshpass binary
        uses: actions/download-artifact@v4
        with:
          name: sshpass-exe

      - name: Check for existing Chocolatey version
        id: choco_check
        shell: pwsh
        run: |
          $version = "${{ needs.package-and-release.outputs.version }}"

          # Check if this version already exists on Chocolatey
          try {
            $response = Invoke-RestMethod "https://community.chocolatey.org/api/v2/package-versions/sshpass-win64" -ErrorAction Stop
            if ($response -contains $version) {
              echo "Version $version already exists on Chocolatey — skipping."
              echo "SKIP=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
          } catch {
            echo "Could not check Chocolatey API (package may not exist yet): $_"
          }

          echo "No existing version $version found on Chocolatey."
          echo "SKIP=false" >> $env:GITHUB_OUTPUT

      - name: Build and push Chocolatey package
        if: steps.choco_check.outputs.SKIP != 'true'
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $version = "${{ needs.package-and-release.outputs.version }}"
          $hash = "${{ needs.package-and-release.outputs.zip_hash }}"
          $zipUrl = "${{ needs.package-and-release.outputs.zip_url }}"

          echo "=== Publishing sshpass-win64 $version to Chocolatey ==="

          # Update nuspec version
          $nuspecPath = "packaging/chocolatey/sshpass-win64.nuspec"
          (Get-Content $nuspecPath) -replace '\$VERSION\$', $version | Set-Content $nuspecPath

          # Update install script with actual URL and checksum
          $installPath = "packaging/chocolatey/tools/chocolateyinstall.ps1"
          $content = Get-Content $installPath -Raw
          $content = $content -replace '\$CHECKSUM\$', $hash
          $content = $content -replace 'https://github\.com/sharpninja/sshpass-win64/releases/download/v\$VERSION\$/sshpass-win64-\$VERSION\$\.zip', $zipUrl
          $content | Set-Content $installPath

          # Pack
          Push-Location packaging/chocolatey
          choco pack
          Pop-Location

          # Find the nupkg
          $nupkg = Get-ChildItem packaging/chocolatey/*.nupkg | Select-Object -First 1
          if (-not $nupkg) {
            echo "ERROR: No .nupkg file found!"
            exit 1
          }

          echo "Package: $($nupkg.Name)"

          # Push to Chocolatey Community Repository
          choco push $nupkg.FullName `
            --source https://push.chocolatey.org/ `
            --api-key $env:CHOCO_API_KEY

          echo "=== Chocolatey submission complete ==="
