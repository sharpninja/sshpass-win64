ShortDescription: Non-interactive SSH password authentication tool - native Win64 port
Description: |-
  sshpass is a utility designed for running SSH in non-interactive mode,
  providing the password via the command line, environment variable, or file.
  This is a native Windows 64-bit port using the Windows ConPTY (Pseudo Console) API.
  No Cygwin or WSL required. Requires Windows 10 version 1809 or later.
